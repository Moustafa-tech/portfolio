name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows manually triggering a deployment from the Actions tab.
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between an
# in-progress run and the latest queued one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Note: npm dependency caching (cache: npm) is intentionally left
          # off here because it requires a committed package-lock.json.
          # Once you run `npm install` locally and commit the generated
          # package-lock.json, you can add `cache: npm` back for faster
          # builds — see the README's GitHub Pages section.

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
